[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-analytics-kit"
version = "0.1.0"
description = "Graph analytics: centrality, shortest paths, clustering, community detection, and link prediction with reproducible Markdown reports."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhtasim-Munif-Fahim"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
graph-analytics = "graph_analytics_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
